# Vue Router가 createWebHistory(SPA, 서버 라우팅 없음)를 쓰므로 존재하지
# 않는 정적 경로는 항상 index.html로 폴백해야 클라이언트 라우터가
# 처리할 수 있다 - 그 외엔 이 서비스 안에서 /api를 알 필요가 전혀 없다
# (앞단 공용 nginx가 /api는 이 서비스로 안 보내고 backend로 직접
# 돌린다, 루트 nginx/default.conf 참고).
server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
