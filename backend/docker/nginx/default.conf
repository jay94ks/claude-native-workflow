# 보안 강화(#gitea-nginx-lockdown) - Gitea는 호스트에 전혀 노출되지
# 않는다(docker-compose.yml의 gitea 서비스에 ports: 없음). 이 nginx가
# 유일한 호스트 노출 지점이고, git smart-HTTP 프로토콜 경로(`.git`로
# 끝나는 URL과 그 하위 경로 - info/refs, git-upload-pack,
# git-receive-pack)만 Gitea로 그대로 돌려주고, 나머지 전부(Gitea 웹
# UI 포함)는 backend로 보낸다 - 즉 Gitea의 저장소 브라우징/관리 화면은
# 이 origin을 통해서는 아예 도달할 수 없다("특별한 명시가 없는 한
# 모든 저장소가 Web UI로 안 보임"이 네트워크 토폴로지로 자연히
# 만족됨).
server {
  listen 80;

  # git clone/fetch/push가 실제로 때리는 경로들 - 전부 "/{org}/{repo}.git"
  # 아래([info/refs?service=...], [git-upload-pack], [git-receive-pack]).
  location ~ ^/[^/]+/[^/]+\.git(/.*)?$ {
    proxy_pass http://gitea:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # git push는 큰 팩 파일을 청크로 보낼 수 있다 - 기본 client_max_body_size
    # (1m)에 막히지 않도록 해제.
    client_max_body_size 0;
  }

  location / {
    proxy_pass http://backend:8760;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
