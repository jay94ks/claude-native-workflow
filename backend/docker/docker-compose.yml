# backend + postgres(기본 DB) + meilisearch + emqx + gitea. 시크릿은 이
# 폴더의 .env(.env.example 참고, 커밋 안 함)에서 읽는다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_native_workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped

  # EMQX REST API 키는 이미지가 기본으로 만들어주지 않는다 - 최초
  # 기동 후 대시보드(http://localhost:18083, 기본 admin/public)에
  # 로그인해서 API Key 하나를 발급받아 .env의 EMQX_API_KEY/
  # EMQX_API_SECRET에 채워 넣어야 한다(1회성 수동 단계 - JWT_SECRET
  # 같은 다른 시크릿과 동일하게 설치 시 직접 채우는 항목).
  emqx:
    image: emqx/emqx:5.8
    volumes:
      - emqx-data:/opt/emqx/data
    ports:
      - "18083:18083" # 대시보드/REST API - API 키 발급 때만 필요, 평소엔 안 열어도 됨
    restart: unless-stopped

  # Gitea 자체 메타데이터는 내장 SQLite로 충분(설치용 Postgres와 섞지
  # 않음). SSH는 노출하지 않는다 - git clone/push는 설계자가 Gitea의
  # HTTP(S) git 프로토콜로 직접 하고, 백엔드는 REST API로 저장소 생성/
  # 웹훅 등록/파일 커밋만 한다. 웹 UI 포트만 호스트에 노출해서 설치
  # 마법사+관리자 계정 생성+PAT 발급을 1회 수동으로 할 수 있게 한다
  # (EMQX API Key 발급과 같은 패턴).
  gitea:
    image: gitea/gitea:latest
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:${GITEA_HOST_PORT:-3001}/
    volumes:
      - gitea-data:/data
    ports:
      - "${GITEA_HOST_PORT:-3001}:3000"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: 8760
      HOST: 0.0.0.0
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/claude_native_workflow
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      EMQX_API_URL: http://emqx:18083
      EMQX_API_KEY: ${EMQX_API_KEY}
      EMQX_API_SECRET: ${EMQX_API_SECRET}
      GITEA_API_URL: http://gitea:3000
      GITEA_ADMIN_USERNAME: ${GITEA_ADMIN_USERNAME}
      GITEA_API_TOKEN: ${GITEA_API_TOKEN}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL}
    ports:
      - "${BACKEND_HOST_PORT:-8760}:8760"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  meili-data:
  emqx-data:
  gitea-data:
