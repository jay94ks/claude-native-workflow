# vite.config.ts의 dev 서버 프록시(/api -> 127.0.0.1:8766)를 컨테이너
# 환경에서 재현 - docker-compose.yml의 서비스명 "backend"로 라우팅한다.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8766/api/;
        proxy_set_header Host $host;
    }
}
