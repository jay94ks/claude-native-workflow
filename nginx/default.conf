server {
    listen 80;

    location ~ ^/[^/]+/[^/]+\.git {
        proxy_pass http://gitea:3000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8388;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
