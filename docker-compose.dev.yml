# 로컬 개발용 인프라 전용 compose - postgres/meilisearch/emqx만 컨테이너로
# 띄우고, backend(tsx)/frontend(quasar dev)/cli는 호스트에서 직접 실행한다.
# docker-compose.yml(전체 컨테이너 빌드 - backend/frontend Dockerfile,
# gitea, nginx 리버스 프록시)은 아직 실기동 검증된 적이 없어서 별도로
# 둔다 - 이 파일은 오직 "지금 바로 로컬에서 써보기" 용도.
#
# 호스트 포트는 이 머신의 다른 claude-native-workflow 설치(운영 중인
# 별도 인스턴스)와 절대 겹치지 않도록 전부 비표준 포트로 고정했다
# (특히 EMQX 1883/8083은 그 설치가 이미 쓰고 있어 반드시 피해야 함).

services:
  postgres:
    image: postgres:16-alpine
    container_name: cnw-v3-dev-postgres
    environment:
      POSTGRES_DB: cnw
      POSTGRES_USER: cnw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: cnw-v3-dev-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
    ports:
      - "17700:7700"
    volumes:
      - ./data/meilisearch:/meili_data

  emqx:
    image: emqx/emqx:5.8
    container_name: cnw-v3-dev-emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_SERVICE_USERNAME}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_SERVICE_PASSWORD}
    ports:
      - "11883:1883"
      - "18084:18083"
    volumes:
      - ./data/emqx:/opt/emqx/data

  # docs/plan-gitea-provisioning.md - 이 저장소 전용 Gitea(push-mirror
  # 프로비저닝 실기동 검증용). 이 머신의 다른 claude-native-workflow
  # 설치(C:\CNW)가 이미 자기 gitea 컨테이너를 갖고 있으므로 - 그건
  # docker-compose.yml이 다른 파일(C:\CNW\docker-compose.yml)이라
  # 완전히 별개이고, 여기서도 절대 그걸 건드리지 않는다 - 포트/컨테이너
  # 이름 전부 새로 고정한다. sqlite로 둬서 postgres 서비스에 얹지 않고
  # 완전히 독립적으로 뜨고 지울 수 있게 한다.
  gitea:
    image: gitea/gitea:1.22
    container_name: cnw-v3-dev-gitea
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:13000/
      GITEA__server__HTTP_PORT: "3000"
    ports:
      - "13000:3000"
    volumes:
      - ./data/gitea:/data
