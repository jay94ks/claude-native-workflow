# backend + postgres(기본 DB) + meilisearch + emqx + gitea. 시크릿은 이
# 폴더의 .env(.env.example 참고, 커밋 안 함)에서 읽는다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_native_workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped

  # EMQX REST API 키는 이미지가 기본으로 만들어주지 않지만, 대시보드에
  # 수동으로 로그인해서 발급받을 필요는 없다 - `api_key.bootstrap_file`
  # (env로는 EMQX_API_KEY__BOOTSTRAP_FILE)에 "key:secret" 형식 파일을
  # 지정하면 기동 시점에 그 키를 그대로 만들어준다(실제 emqx/emqx:5.8
  # 컨테이너에 대고 확인함 - 대시보드로 만든 키와 동일하게 REST API가
  # 인증됨, `/api/v5/authentication`·`/api/v5/authorization/sources`
  # 양쪽 다 200 확인). 아래 `configs.emqx_api_key_bootstrap`가 .env의
  # EMQX_API_KEY/EMQX_API_SECRET 값을 그대로 그 파일 내용으로 채운다 -
  # Meilisearch의 MEILI_MASTER_KEY와 똑같이 "본인이 정하는 값을 그냥
  # .env에 적는다"로 통일된다. 두 값이 비어 있으면(기본값) EMQX가 그
  # 줄을 무시하고 경고만 남긴 채 정상 기동한다(직접 재현 확인 - 배포가
  # 안 깨짐, 그냥 이 기능만 꺼진 채로 지금까지와 동일하게 동작).
  # **주의**: 이미 떠 있는 상태에서 .env의 두 값을 바꿨다면
  # `docker compose up -d --force-recreate emqx`처럼 명시적으로 재생성
  # 해야 반영된다(평범한 `up -d`는 설정 파일 내용 변경만으로는 자동
  # 재생성을 안 한다는 것도 실제로 확인함) - 최초 설치(컨테이너가 아직
  # 없는 상태)는 이 문제와 무관하게 항상 바로 적용된다.
  emqx:
    image: emqx/emqx:5.8
    environment:
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/etc/api_key_bootstrap
    configs:
      - source: emqx_api_key_bootstrap
        target: /opt/emqx/etc/api_key_bootstrap
    volumes:
      - emqx-data:/opt/emqx/data
    ports:
      - "18083:18083" # 대시보드/REST API - 평소엔 안 열어도 되지만, 부트스트랩이 아닌 수동 키 발급/운영 확인용으로 남겨둠
      # MQTT-over-WebSocket(8083) - 이미지 기본 리스너, 별도 설정 없이 이미
      # 켜져 있다. 웹 UI(Phase 5 3/3)가 변경 추적 뷰/메시징 패널 실시간
      # 갱신을 위해 브라우저에서 직접 붙는 통로 - PUBLIC_EMQX_WS_URL과 짝.
      - "${EMQX_WS_HOST_PORT:-8083}:8083"
      # 원본 MQTT(TCP, 1883) - CLI/MCP가 message wait에서 EMQX에 직접
      # 구독할 때 쓰는 통로(#message-wait-mqtt-direct - 브라우저가 아니라
      # 호스트에서 실행되는 Node 프로세스라 WS가 아닌 원본 TCP로 붙는다).
      # PUBLIC_EMQX_MQTT_URL과 짝 - 비워두면 CLI/MCP는 기존 HTTP 폴링으로
      # 자동 폴백한다.
      - "${EMQX_MQTT_HOST_PORT:-1883}:1883"
    restart: unless-stopped

  # Gitea 자체 메타데이터는 내장 SQLite로 충분(설치용 Postgres와 섞지
  # 않음). SSH는 노출하지 않는다 - git clone/push는 설계자가 Gitea의
  # HTTP(S) git 프로토콜로 직접 하고, 백엔드는 REST API로 저장소 생성/
  # 웹훅 등록/파일 커밋만 한다. **호스트 포트를 아예 열지 않는다**
  # (#gitea-nginx-lockdown, 보안 강화) - 예전엔 설치 마법사+PAT 발급을
  # 위해 웹 UI 포트를 잠깐이라도 열어야 했지만, 이제 관리자 계정/PAT
  # 발급 전부 `docker exec ... gitea admin user create`/
  # `generate-access-token` CLI로 대체했다(README.md "Gitea 설정" 절).
  # git clone/push는 아래 nginx가 `.git`로 끝나는 요청만 골라 이
  # 컨테이너로 그대로 돌려준다 - Gitea의 웹 UI(저장소 브라우징 등)는
  # 이 origin을 통해서는 원천적으로 도달 불가능하다.
  gitea:
    image: gitea/gitea:latest
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${PUBLIC_GITEA_URL:-http://localhost}/
      # 이게 없으면 완전히 새 volume(진짜 신규 설치)에서 app.ini가
      # INSTALL_LOCK=false로 생성돼, "웹 설치 마법사 폐지"(CLI 부트스트랩,
      # #gitea-nginx-lockdown)의 전제가 깨진다 - `gitea admin user create`
      # 등 CLI 명령이 "Unable to load config file for a installed Gitea
      # instance"로 거부된다. 기존 dev 스택은 이 옵션이 추가되기 전에
      # 웹 설치 마법사로 이미 설치된 volume이라 이 문제를 못 보고 넘어갔던
      # 것 - 완전히 새 설치(C:\CNW, fresh volume)를 실제로 구성하며 발견함.
      GITEA__security__INSTALL_LOCK: "true"
      # Gitea는 기본적으로 사설/내부 네트워크 호스트로의 웹훅 발송을
      # SSRF 방지 차원에서 막는다 - 이 설정 없이는 backend 컨테이너로
      # 웹훅이 절대 도달하지 못한다(같은 compose 네트워크 안이라도).
      # 실제 Gitea 인스턴스에 웹훅을 쏴보고 로그에서
      # "webhook can only call allowed HTTP servers"로 직접 확인한 뒤
      # 추가함 - 처음엔 이 설정이 없어서 조용히 실패하고 있었다.
      GITEA__security__ALLOWED_HOST_LIST: backend
    volumes:
      - gitea-data:/data
    # ⚠ 임시 디버깅용 - Gitea 웹 UI를 직접 열어야 할 때만 주석 해제하고
    # 작업이 끝나면 반드시 다시 주석 처리할 것(협업자 권한이 있는
    # 누구나 이 포트를 통해 파일트리/커밋을 직접 볼 수 있게 됨).
    # ports:
    #   - "${GITEA_HOST_PORT:-3001}:3000"
    restart: unless-stopped

  backend:
    build:
      # 저장소 루트가 컨텍스트 - Dockerfile이 frontend/도 같은 이미지에
      # 빌드해 넣는다(Phase 5부터, backend/Dockerfile 상단 주석 참고).
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8760
      HOST: 0.0.0.0
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/claude_native_workflow
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      EMQX_API_URL: http://emqx:18083
      EMQX_API_KEY: ${EMQX_API_KEY}
      EMQX_API_SECRET: ${EMQX_API_SECRET}
      EMQX_MQTT_URL: mqtt://emqx:1883
      EMQX_SERVICE_USERNAME: ${EMQX_SERVICE_USERNAME}
      EMQX_SERVICE_PASSWORD: ${EMQX_SERVICE_PASSWORD}
      GITEA_API_URL: http://gitea:3000
      GITEA_ADMIN_USERNAME: ${GITEA_ADMIN_USERNAME}
      GITEA_API_TOKEN: ${GITEA_API_TOKEN}
      GITEA_ORG_PREFIX: ${GITEA_ORG_PREFIX}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL}
      PUBLIC_GITEA_URL: ${PUBLIC_GITEA_URL}
      PUBLIC_EMQX_WS_URL: ${PUBLIC_EMQX_WS_URL}
      PUBLIC_EMQX_MQTT_URL: ${PUBLIC_EMQX_MQTT_URL}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
    # 개발 편의용 - 필요하면 주석 해제(nginx를 거치지 않고 backend에
    # 직접 붙고 싶을 때만). 운영 배포에서는 nginx만 host에 노출하는
    # 쪽이 안전하다(#gitea-nginx-lockdown).
    # ports:
    #   - "${BACKEND_HOST_PORT:-8760}:8760"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 유일한 기본 호스트 노출 지점(#gitea-nginx-lockdown) - `.git`로
  # 끝나는 git smart-HTTP 요청만 gitea로, 나머지는 전부 backend로
  # 돌린다(nginx/default.conf 참고). Gitea 자신의 웹 UI는 이 origin을
  # 통해서는 아예 도달할 수 없다.
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PUBLIC_HOST_PORT:-80}:80"
    depends_on:
      - backend
      - gitea
    restart: unless-stopped

volumes:
  postgres-data:
  meili-data:
  emqx-data:
  gitea-data:

configs:
  # emqx 서비스의 EMQX_API_KEY__BOOTSTRAP_FILE이 가리키는 파일 내용 -
  # .env의 EMQX_API_KEY/EMQX_API_SECRET을 그대로 "key:secret" 한 줄로
  # 채운다(Compose가 .env 값을 여기 보간해준다 - 실제 emqx:5.8 컨테이너로
  # 검증 완료).
  emqx_api_key_bootstrap:
    content: |
      ${EMQX_API_KEY}:${EMQX_API_SECRET}
